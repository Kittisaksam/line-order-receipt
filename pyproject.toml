[project]
name = "arma"
version = "0.1.0"
description = "LINE order chat → monthly PDF receipts (ARMA LASER)"
readme = "README.md"
authors = [
    { name = "Kittisak Prachyachuwong", email = "kittisak.p@coraline.co.th" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pypdf>=6.19.0",
    "pythainlp>=5.3.8",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.2",
    "weasyprint>=70.0",
]

[project.scripts]
arma = "arma.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
